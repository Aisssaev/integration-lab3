name: ml-pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "Кількість епох навчання"
        default: "10"
      push_image:
        description: "Опублікувати образ у GHCR"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EPOCHS: >-
    ${{ inputs.epochs
        || (github.event_name == 'pull_request' && '2' || '10') }}
  MIN_ACCURACY: ${{ github.event_name == 'pull_request' && '85' || '95' }}
  SEED: "42"
  CLASSES: "yes no up down"
  DATASET_KEY: speech-commands-v0.02-yes-no-up-down
  IMAGE: kws-api:ci
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.4 && ruff check src/ scripts/ tests/

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose

  train:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        run: |
          [[ "$EPOCHS" =~ ^[0-9]+$ ]] && (( EPOCHS >= 1 && EPOCHS <= 50 )) \
            || { echo "::error::epochs має бути цілим числом від 1 до 50, отримано '$EPOCHS'"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore dataset cache
        id: dataset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/
          key: ${{ env.DATASET_KEY }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build trainer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: trainer
          load: true
          tags: kws-trainer:ci
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,mode=max,scope=trainer

      - name: Train in container
        run: |
          set -o pipefail
          mkdir -p artifacts data
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GIT_COMMIT="$GITHUB_SHA" \
            -v "$PWD/data:/data" -v "$PWD/artifacts:/artifacts" kws-trainer:ci \
            --classes $CLASSES --epochs "$EPOCHS" --seed "$SEED" \
            --model-version "1.0.0+${GITHUB_SHA::7}" --out /artifacts 2>&1 | tee artifacts/train.log

      - name: Training summary
        run: |
          jq '{accuracy, model_size_kb, epochs, seed, train_time_s}' artifacts/metrics.json
          echo "### Training: accuracy $(jq .accuracy artifacts/metrics.json)%, $EPOCHS epochs, dataset cache hit: ${{ steps.dataset.outputs.cache-hit == 'true' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model
          path: |
            artifacts/model.pt
            artifacts/labels.json
            artifacts/metrics.json
            artifacts/history.json
            artifacts/train.log
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_id: ${{ steps.save.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model
          path: artifacts/

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read model version
        run: echo "MODEL_VERSION=$(jq -r .model_version artifacts/labels.json)" >> "$GITHUB_ENV"

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            MODEL_VERSION=${{ env.MODEL_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Start service
        run: |
          docker run -d --name kws -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs kws
          exit 1

      - name: Golden-sample check
        run: |
          pip install requests==2.32.3
          python scripts/verify_model.py --url http://localhost:8000 \
            --expected samples/expected.json --out metrics/verify.json

      - name: Quality gate (accuracy)
        run: |
          curl -sf http://localhost:8000/model-info | tee metrics/model-info.json
          echo
          jq -e ".accuracy >= $MIN_ACCURACY" metrics/model-info.json \
            || { echo "::error::accuracy $(jq .accuracy metrics/model-info.json)% нижча за поріг $MIN_ACCURACY%"; exit 1; }

      - name: Latency benchmark
        run: |
          python scripts/benchmark.py --url http://localhost:8000 \
            --n 100 --warmup 10 --out metrics/latency.json

      - name: Report
        if: always()
        run: |
          mkdir -p metrics
          docker logs kws > metrics/service.log 2>&1 || true
          python scripts/make_report.py --metrics metrics/ --model artifacts/metrics.json \
            --out metrics/report.md
          cat metrics/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: metrics/
          retention-days: 14

      - name: Save verified image
        id: save
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "Verified image: $image_id" >> "$GITHUB_STEP_SUMMARY"
          docker save "$IMAGE" | gzip -1 > kws-api.tar.gz
          ls -lh kws-api.tar.gz

      - name: Upload verified image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: kws-api.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  integration-tests:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        torch_threads: ["1", "2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load and start verified image
        run: |
          gunzip -c kws-api.tar.gz | docker load
          docker run -d --name kws -p 8000:8000 -e TORCH_THREADS=${{ matrix.torch_threads }} "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs kws
          exit 1

      - name: Run pytest
        run: |
          pip install -r requirements-dev.txt
          mkdir -p test-results
          API_URL=http://localhost:8000 pytest -v tests/ \
            --junitxml=test-results/junit-threads-${{ matrix.torch_threads }}.xml

      - name: Test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob("test-results/*.xml"):
              suite = ET.parse(path).getroot()
              suite = suite.find("testsuite") if suite.tag == "testsuites" else suite
              total, failed = int(suite.get("tests")), int(suite.get("failures")) + int(suite.get("errors"))
              print(f"### Integration tests (TORCH_THREADS=${{ matrix.torch_threads }}): "
                    f"{total - failed}/{total} passed, {float(suite.get('time')):.1f} s")
          EOF

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-threads-${{ matrix.torch_threads }}
          path: test-results/
          retention-days: 14

  trivy-scan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Scan image (fail on CRITICAL)
        run: |
          gunzip kws-api.tar.gz
          docker run --rm -v "$PWD:/scan" -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image --input /scan/kws-api.tar \
            --severity HIGH,CRITICAL --format table --output /scan/trivy.txt
          docker run --rm -v "$PWD:/scan" -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image --input /scan/kws-api.tar \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --format table

      - name: Upload trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy
          path: trivy.txt
          retention-days: 14

  build-push:
    needs: [verify, integration-tests, trivy-scan, gitleaks]
    if: github.event_name == 'push' || inputs.push_image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load verified image
        run: |
          gunzip -c kws-api.tar.gz | docker load
          loaded=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "verified: ${{ needs.verify.outputs.image_id }}"
          echo "loaded:   $loaded"
          [ "$loaded" = "${{ needs.verify.outputs.image_id }}" ]

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/kws-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tag and push verified image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
          done

      - name: Prove pushed image is the verified one
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag=$(echo "$TAGS" | head -n1)
          repo_digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$first_tag" \
            | grep "^${first_tag%:*}@")
          docker image rm $TAGS "$IMAGE" > /dev/null
          docker pull -q "$repo_digest"
          pulled=$(docker image inspect --format '{{.Id}}' "$repo_digest")
          {
            echo "### Published image"
            echo '```'
            echo "$TAGS"
            echo "registry digest: $repo_digest"
            echo "verified image:  ${{ needs.verify.outputs.image_id }}"
            echo "pulled image:    $pulled"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$pulled" = "${{ needs.verify.outputs.image_id }}" ]
